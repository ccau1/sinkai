version: "3.9"

services:
  app:
    image: ${APP_IMAGE}
    expose:
      - "80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.sinkai-prod.rule=Host(`${DOMAIN_PROD}`)"
      - "traefik.http.routers.sinkai-prod.entrypoints=websecure"
      - "traefik.http.routers.sinkai-prod.tls=true"
      - "traefik.http.routers.sinkai-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.sinkai-prod.loadbalancer.server.port=80"
    networks:
      - default
      - traefik
    restart: unless-stopped

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
