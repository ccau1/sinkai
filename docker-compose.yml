services:
  cms:
    build:
      context: .
      dockerfile: packages/cms/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-local-dev-secret}
    volumes:
      # Bind-mount the host .wrangler/state so the Docker CMS and host CLI
      # commands (npm run seed, npm run migrate, etc.) share the same D1 DB.
      - ./packages/cms/.wrangler/state:/app/packages/cms/.wrangler/state:delegated
    restart: unless-stopped

  # Serves the Next.js standalone build produced on the host by `make up`
  # (npm run build -w packages/web). Runs as a Node server with ISR; content
  # revalidates against the CMS service at runtime.
  app:
    image: node:22-alpine
    working_dir: /app
    command: node packages/web/server.js
    ports:
      - "3200:80"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=80
      - CMS_API_URL=http://cms:3001
    volumes:
      - ./packages/web/.next/standalone:/app:ro
      - ./packages/web/.next/static:/app/packages/web/.next/static:ro
      - ./packages/web/public:/app/packages/web/public:ro
    depends_on:
      - cms
    restart: unless-stopped
