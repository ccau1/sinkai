version: "3.9"

services:
  app:
    image: ${APP_IMAGE}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sinkai-staging.rule=Host(`sinkai.staging.tribalorigin.com`)"
      - "traefik.http.routers.sinkai-staging.entrypoints=websecure"
      - "traefik.http.routers.sinkai-staging.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sinkai-staging.middlewares=compress@file"
      - "traefik.http.services.sinkai-staging.loadbalancer.server.port=80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - staging
    restart: unless-stopped

networks:
  staging:
    external: true
