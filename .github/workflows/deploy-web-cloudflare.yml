name: Deploy Web to Cloudflare Pages (staging → production)

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - '.github/workflows/deploy-web-cloudflare.yml'
  workflow_run:
    workflows: ['Deploy CMS to Cloudflare']
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PAGES_PROJECT_NAME_PROD: sinkai-web
  PAGES_PROJECT_NAME_STAGING: sinkai-web-staging

jobs:
  deploy-staging:
    name: Deploy Web to Staging
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web (staging)
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL_STAGING }}
          NEXT_PUBLIC_ENABLE_IMAGE_TRANSFORMS: true
          NEXT_PUBLIC_CMS_IMAGE_TRANSFORM_ORIGIN: https://sinkai-cms.staging.tribalorigin.com
        run: npm run build -w packages/web

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy packages/web/dist --project-name=${{ env.PAGES_PROJECT_NAME_STAGING }} --branch=main

      - name: Purge Cloudflare cache (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  promote-to-prod:
    name: Promote Web to Production
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web (production)
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL_PROD }}
          NEXT_PUBLIC_ENABLE_IMAGE_TRANSFORMS: true
          NEXT_PUBLIC_CMS_IMAGE_TRANSFORM_ORIGIN: https://sinkai-cms.tribalorigin.com
        run: npm run build -w packages/web

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy packages/web/dist --project-name=${{ env.PAGES_PROJECT_NAME_PROD }} --branch=main

      - name: Purge Cloudflare cache (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
