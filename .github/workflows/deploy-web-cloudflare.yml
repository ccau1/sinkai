name: Deploy Web to Cloudflare Workers (staging → production)

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - '.github/workflows/deploy-web-cloudflare.yml'
  workflow_run:
    workflows: ['Deploy CMS to Cloudflare']
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  deploy-staging:
    name: Deploy Web to Staging
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web (standalone)
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL_STAGING }}
          NEXT_PUBLIC_CMS_API_URL: ${{ secrets.CMS_API_URL_STAGING }}
          NEXT_PUBLIC_ENABLE_IMAGE_TRANSFORMS: true
          NEXT_PUBLIC_CMS_IMAGE_TRANSFORM_ORIGIN: ${{ secrets.MEDIA_PUBLIC_URL_STAGING || 'https://sinkai-cms-media.staging.tribalorigin.com' }}
        run: npm run build -w packages/web

      - name: Build OpenNext worker bundle
        run: npm run build:worker -w packages/web

      - name: Inject tag-cache D1 database id (staging)
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D1_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[] | select(.name == "sinkai-web-tags-staging") | .uuid')
          test -n "$D1_ID"
          sed -i "s|\"database_id\": \"STAGING_D1_DATABASE_ID\"|\"database_id\": \"$D1_ID\"|" wrangler.jsonc

      - name: Populate remote ISR cache (staging)
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare populateCache remote

      - name: Deploy web worker (staging)
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set REVALIDATE_SECRET worker secret (staging)
        if: ${{ env.REVALIDATE_SECRET != '' }}
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "$REVALIDATE_SECRET" | npx wrangler secret put REVALIDATE_SECRET --name sinkai-web-staging

      - name: Purge Cloudflare cache (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  promote-to-prod:
    name: Promote Web to Production
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web (standalone)
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL_PROD }}
          NEXT_PUBLIC_CMS_API_URL: ${{ secrets.CMS_API_URL_PROD }}
          NEXT_PUBLIC_ENABLE_IMAGE_TRANSFORMS: true
          NEXT_PUBLIC_CMS_IMAGE_TRANSFORM_ORIGIN: ${{ secrets.MEDIA_PUBLIC_URL_PROD || 'https://sinkai-cms-media.tribalorigin.com' }}
        run: npm run build -w packages/web

      - name: Build OpenNext worker bundle
        run: npm run build:worker -w packages/web

      - name: Inject tag-cache D1 database id (production)
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D1_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[] | select(.name == "sinkai-web-tags-prod") | .uuid')
          test -n "$D1_ID"
          sed -i "s|\"database_id\": \"PROD_D1_DATABASE_ID\"|\"database_id\": \"$D1_ID\"|" wrangler.jsonc

      - name: Populate remote ISR cache (production)
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare populateCache remote --env production

      - name: Deploy web worker (production)
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Set REVALIDATE_SECRET worker secret (production)
        if: ${{ env.REVALIDATE_SECRET != '' }}
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "$REVALIDATE_SECRET" | npx wrangler secret put REVALIDATE_SECRET --name sinkai-web-prod

      - name: Purge Cloudflare cache (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
