name: Deploy CMS to Cloudflare (staging → production)

on:
  push:
    branches: [main]
    paths:
      - 'packages/cms/**'
      - 'packages/cms/workers/**'
      - 'cloudflare_deploy/terraform/**'
      - '.github/workflows/deploy-cms-cloudflare.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  deploy-staging:
    name: Deploy CMS to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update wrangler.jsonc with staging Terraform outputs
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          STAGING_D1_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[] | select(.name == "sinkai-cms-staging") | .uuid')
          sed -i "s|\"database_id\": \"STAGING_D1_DATABASE_ID\"|\"database_id\": \"$STAGING_D1_ID\"|" wrangler.jsonc

      - name: Deploy Thumbnails Worker to Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c packages/cms/workers/thumbnails/wrangler.jsonc

      - name: Deploy CMS Worker to Staging
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: npm run deploy:app

      - name: Set PAYLOAD_SECRET worker secret (staging)
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: echo "$PAYLOAD_SECRET" | npx wrangler secret put PAYLOAD_SECRET --name sinkai-cms-staging

      - name: Apply remote D1 migrations (staging)
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: npm run migrate:remote

  promote-to-prod:
    name: Promote CMS to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update wrangler.jsonc with production Terraform outputs
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROD_D1_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[] | select(.name == "sinkai-cms-prod") | .uuid')
          sed -i "s|\"database_id\": \"PROD_D1_DATABASE_ID\"|\"database_id\": \"$PROD_D1_ID\"|" wrangler.jsonc

      - name: Deploy Thumbnails Worker to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c packages/cms/workers/thumbnails/wrangler.jsonc --env production

      - name: Deploy CMS Worker to Production
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: npm run deploy:app:production

      - name: Set PAYLOAD_SECRET worker secret (production)
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: echo "$PAYLOAD_SECRET" | npx wrangler secret put PAYLOAD_SECRET --name sinkai-cms-prod

      - name: Apply remote D1 migrations (production)
        working-directory: packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLOUDFLARE_ENV: production
        run: npm run migrate:production
